name: run-taxicab-parallelo

on:
  workflow_dispatch:   # si avvia a mano dalla scheda Actions

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false   # se una fetta fallisce, le altre continuano
      matrix:
        include:
          - { start: 2804, end: 2837 }
          - { start: 3797, end: 3828 }
          - { start: 5352, end: 5481 }
          - { start: 6094, end: 6192 }
          - { start: 6744, end: 6845 }
          - { start: 7335, end: 7447 }
          - { start: 8446, end: 8521 }
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Installa Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Imposta la fetta di questo job
        run: |
          sed -i -E "s/(START_INDEX_OVERRIDE = )[^;]+;/\1${{ matrix.start }};/" TaxicabMultiSearchMinMax.java
          sed -i -E "s/(END_INDEX = )[^;]+;/\1${{ matrix.end }};/" TaxicabMultiSearchMinMax.java
          grep -E "START_INDEX_OVERRIDE =|END_INDEX =" TaxicabMultiSearchMinMax.java

      - name: Compila
        run: javac TaxicabMultiSearchMinMax.java

      - name: Esegui (si ferma da solo a 5h45m, prima del limite di 6h)
        run: |
          timeout 345m java -Xmx12g TaxicabMultiSearchMinMax 2>&1 | tee log.txt || true

      - name: Salva risultati e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risultati-${{ matrix.start }}-${{ matrix.end }}
          path: |
            log.txt
            hits_*.txt
          if-no-files-found: ignore
