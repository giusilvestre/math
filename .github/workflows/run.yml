name: run-taxicab-7-283_9

on:
  workflow_dispatch:   # si avvia a mano dalla scheda Actions

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false   # se una fetta fallisce, le altre continuano
      matrix:
        include:
          - { start: 680, end: 3200 }
          - { start: 3200, end: 5700 }
          - { start: 5700, end: 8200 }
          - { start: 8200, end: 10500 }
          - { start: 10500, end: 12800 }
          - { start: 12800, end: 14000 }
          - { start: 14000, end: 15182 }
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Installa Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Imposta la fetta di questo job
        run: |
          sed -i -E "s/(START_INDEX_OVERRIDE = )[^;]+;/\1${{ matrix.start }};/" TaxicabSearch.java
          sed -i -E "s/(END_INDEX = )[^;]+;/\1${{ matrix.end }};/" TaxicabSearch.java
          grep -E "START_INDEX_OVERRIDE =|END_INDEX =" TaxicabSearch.java

      - name: Compila
        run: javac TaxicabSearch.java

      - name: Esegui (si ferma da solo a 5h45m, prima del limite di 6h)
        run: |
          timeout 345m java -Xmx12g TaxicabSearch 2>&1 | tee log.txt || true

      - name: Salva risultati e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risultati-${{ matrix.start }}-${{ matrix.end }}
          path: |
            log.txt
            hits_*.txt
          if-no-files-found: ignore
