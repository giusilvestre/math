name: run-taxicab-parallelo

on:
  workflow_dispatch:   # si avvia a mano dalla scheda Actions

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false   # se una fetta fallisce, le altre continuano
      matrix:
        include:
          - { start: 40003, end: 40950 }
          - { start: 15601, end: 20000 }
          - { start: 20000, end: 25000 }
          - { start: 25000, end: 30000 }
          - { start: 30000, end: 34500 }
          - { start: 34500, end: 38000 }
          - { start: 38000, end: 39766 }
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Installa Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Imposta la fetta di questo job
        run: |
          sed -i -E "s/(START_INDEX_OVERRIDE = )[^;]+;/\1${{ matrix.start }};/" TaxicabMultiSearch.java
          sed -i -E "s/(END_INDEX = )[^;]+;/\1${{ matrix.end }};/" TaxicabMultiSearch.java
          grep -E "START_INDEX_OVERRIDE =|END_INDEX =" TaxicabMultiSearch.java

      - name: Compila
        run: javac TaxicabMultiSearch.java

      - name: Esegui (si ferma da solo a 5h45m, prima del limite di 6h)
        run: |
          timeout 345m java -Xmx12g TaxicabMultiSearch 2>&1 | tee log.txt || true

      - name: Salva risultati e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risultati-${{ matrix.start }}-${{ matrix.end }}
          path: |
            log.txt
            hits_*.txt
          if-no-files-found: ignore
